<!DOCTYPE html>
<html>
<head>
    <title>Word of the Week</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="page-title">Word of the Week</h1>

    <!-- Search Bar -->
    <input type="text" id="searchBar" placeholder="Search words..." class="search-input">

    <!-- Container for dynamic entries -->
    <div id="wotwContainer" class="wotw-container"></div>

    <script>
        async function loadWOTW() {
            const response = await fetch("wotw.json");
            const data = await response.json();

            const container = document.getElementById("wotwContainer");

            data.forEach(entry => {
                const div = document.createElement("div");
                div.className = "wotw-entry";

			div.innerHTML = `
				<video controls class="wotw-video">
					<source src="${entry.video}" type="video/mp4">
				</video>
			`;

            // Search functionality
            const searchBar = document.getElementById("searchBar");
            searchBar.addEventListener("keyup", () => {
                const query = searchBar.value.toLowerCase();
                const entries = document.querySelectorAll(".wotw-entry");

                entries.forEach(entry => {
                    const text = entry.textContent.toLowerCase();
                    entry.style.display = text.includes(query) ? "" : "none";
                });
            });
        }

        loadWOTW();
    </script>

</body>
</html>
