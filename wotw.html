<!DOCTYPE html>
<html>
<head>
    <title>Word of the Week</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="page-title">Word of the Week</h1>

    <!-- Search Bar -->
    <input type="text" id="searchBar" placeholder="Search words..." class="search-input">

    <!-- Container for dynamic entries -->
    <div id="wotwContainer" class="wotw-container"></div>

    <script>
        async function loadWOTW() {
            const response = await fetch("wotw.json");
            const data = await response.json();

            const container = document.getElementById("wotwContainer");

		data.forEach(entry => {
			const div = document.createElement("div");
			div.className = "wotw-item";

			div.innerHTML = `
				<video controls class="wotw-video">
					<source src="${entry.video}" type="video/mp4">
				</video>
			`;

			container.appendChild(div);
		});

            // Search functionality
            const searchBar = document.getElementById("searchBar");

				searchBar.addEventListener("keyup", () => {
					const query = searchBar.value.toLowerCase();
					const entries = document.querySelectorAll(".wotw-entry");

					entries.forEach((entry, index) => {
						// Combine ALL metadata into one searchable string
						const metadata = `
							${data[index].word}
							${data[index].transliteration}
							${data[index].meaning}
							${data[index].example}
							${data[index]["example-transliteration"]}
							${data[index]["example-meaning"]}
							${data[index].video}
						`.toLowerCase();

					// If search bar is empty → show everything
						if (query.trim() === "") {
							entry.style.display = "";
						} else {
							entry.style.display = metadata.includes(query) ? "" : "none";
						}
					});
				});

        loadWOTW();
    </script>

</body>
</html>
